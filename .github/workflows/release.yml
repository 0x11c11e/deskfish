# Every push to main becomes a GitHub Release with one asset, deskfish.vsix, so the download on
# deskfish.sh (…/releases/latest/download/deskfish.vsix) is always the newest build and nobody
# has to remember to package one. One asset, always the same name: the version is in the release
# title and inside the file, and nobody has to choose between two identical downloads. The version is major.minor from package.json plus the number
# of commits on main, e.g. 0.1.37: bump major.minor by hand in package.json when it matters;
# the patch number takes care of itself.
name: Release
# No path filter: GitHub skipped the very first push because it could not diff a force-pushed,
# unrelated history ("no common ancestor"), and a filter needs a diff. A site-only push costs one
# spare release number; that is cheaper than a release that silently never happens.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also publish this build to the VS Code Marketplace and Open VSX (needs the VSCE_PAT and OVSX_PAT secrets)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Version = major.minor from package.json + commit count
        id: version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          count=$(git rev-list --count HEAD)
          v="$base.$count"
          npm version "$v" --no-git-tag-version
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Deskfish $v"
      - run: npm run build
      - run: npm run package
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$prev" ]; then changes=$(git log --format='- %s' "$prev..HEAD"); else changes=$(git log --format='- %s' -n 20); fi
          notes=$(printf 'Deskfish %s, built from %s.\n\nInstall: download `deskfish.vsix`, then in VS Code choose **Install from VSIX…** from the Extensions view, or run `code --install-extension deskfish.vsix`. Extensions installed from a file do not update themselves; download again for a newer build.\n\n**Changes**\n%s' "$V" "${GITHUB_SHA::7}" "$changes")
          gh release create "v$V" deskfish.vsix --title "Deskfish $V" --notes "$notes"
      # The stores are opt-in: run the workflow by hand and tick "publish". Every push is a GitHub
      # release, but store users get an update prompt for every version, so those are chosen.
      # Each store runs on its own: a missing token skips that store instead of failing the run.
      - name: Publish to the VS Code Marketplace
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "VSCE_PAT secret not set; skipping the Marketplace"; exit 0; fi
          npx --yes @vscode/vsce publish --packagePath deskfish.vsix -p "$VSCE_PAT"
      - name: Publish to Open VSX (Cursor, Windsurf, VSCodium, Gitpod, Theia)
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "OVSX_PAT secret not set; skipping Open VSX"; exit 0; fi
          ns=$(node -p "require('./package.json').publisher")
          npx --yes ovsx create-namespace "$ns" -p "$OVSX_PAT" 2>/dev/null || echo "namespace $ns exists"
          npx --yes ovsx publish deskfish.vsix -p "$OVSX_PAT"
