# LiteLLM proxy config: every entry becomes a model name the extension can use with
#   deskfish.provider = openai-compatible, deskfish.baseUrl = http://localhost:4000/v1
# Keys come from docker/.env (see .env.example). Remove entries you don't have keys for.
model_list:
  - model_name: claude-opus-5
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: grok-4
    litellm_params:
      model: xai/grok-4
      api_key: os.environ/XAI_API_KEY

  - model_name: gpt-5
    litellm_params:
      model: openai/gpt-5
      api_key: os.environ/OPENAI_API_KEY

  # Local vision model through Ollama on the host (ollama pull llama3.2-vision first).
  - model_name: ollama-vision
    litellm_params:
      model: ollama_chat/llama3.2-vision
      api_base: http://host.docker.internal:11434

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  # Optional: require this bearer token from clients (set LITELLM_MASTER_KEY in .env and use it as the API key in the extension).
  master_key: os.environ/LITELLM_MASTER_KEY
