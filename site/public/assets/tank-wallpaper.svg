<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid slice">
  <!-- The tank's wallpaper: rendered at start-up to the real screen size (see openbox/autostart). -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#17343a"/>
      <stop offset="0.55" stop-color="#101a1f"/>
      <stop offset="1" stop-color="#0d1115"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="800" fill="url(#glow)"/>
  <g transform="translate(640 330)">
    <!-- the mascot: a fish inside a monitor (media/icon.svg, scaled ×10) -->
    <g transform="translate(-120 -100) scale(10)" fill="none" stroke="#4fd1e0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="12" rx="2"/>
      <path d="M8 20h8M12 16v4"/>
      <path d="M6.5 10c1.4-1.9 3.3-2.7 4.9-2.4 1.7.3 2.9 1.4 3.4 2.4-.5 1-1.7 2.1-3.4 2.4-1.6.3-3.5-.5-4.9-2.4z"/>
      <path d="M14.8 10l2.9-1.9v3.8z"/>
      <circle cx="8.7" cy="9.6" r=".9" fill="#4fd1e0" stroke="none"/>
    </g>
    <text y="170" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="bold" fill="#e6edf3" letter-spacing="-1">Deskfish</text>
    <text y="206" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#6f7f8a">Give your AI its own computer. Watch it work through the glass.</text>
  </g>
</svg>
